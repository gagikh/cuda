<rect x="438" y="78" width="112" height="38" rx="5" fill="#1f6feb" fill-opacity="0.25" stroke="#58a6ff" stroke-width="1.6"/><text x="494.0" y="102.0" text-anchor="middle" fill="#e6edf3" font-size="14" font-family="Consolas, Menlo, monospace">D</text>
<text x="590" y="102.0" fill="#e3b341" font-size="13" font-family="Consolas, Menlo, monospace">կարդում ենք X</text>
<path d="M 40 138 L 970 138" stroke="#30363d" stroke-width="1"/>
<text x="60" y="158" fill="#e3b341" font-size="12.5" font-weight="bold" font-family="Consolas, Menlo, monospace">__ldg / սովորական load  —  լռելյայն</text>
<rect x="60" y="180" width="112" height="38" rx="5" fill="#d29922" fill-opacity="0.25" stroke="#e3b341" stroke-width="1.6"/><text x="116.0" y="204.0" text-anchor="middle" fill="#e6edf3" font-size="14" font-family="Consolas, Menlo, monospace">X</text>
<rect x="186" y="180" width="112" height="38" rx="5" fill="#1f6feb" fill-opacity="0.25" stroke="#58a6ff" stroke-width="1.6"/><text x="242.0" y="204.0" text-anchor="middle" fill="#e6edf3" font-size="14" font-family="Consolas, Menlo, monospace">A</text>
<rect x="312" y="180" width="112" height="38" rx="5" fill="#1f6feb" fill-opacity="0.25" stroke="#58a6ff" stroke-width="1.6"/><text x="368.0" y="204.0" text-anchor="middle" fill="#e6edf3" font-size="14" font-family="Consolas, Menlo, monospace">B</text>
<rect x="438" y="180" width="112" height="38" rx="5" fill="#1f6feb" fill-opacity="0.25" stroke="#58a6ff" stroke-width="1.6"/><text x="494.0" y="204.0" text-anchor="middle" fill="#e6edf3" font-size="14" font-family="Consolas, Menlo, monospace">C</text>
<rect x="590" y="180" width="112" height="38" rx="5" fill="#f85149" fill-opacity="0.16" stroke="#f85149" stroke-width="1.4" stroke-dasharray="5 4"/><text x="646.0" y="204.0" text-anchor="middle" fill="#f85149" font-size="14" font-family="Consolas, Menlo, monospace">D</text><text x="646.0" y="232" text-anchor="middle" fill="#f85149" font-size="9.5">դուրս է մղվում</text><path d="M 558 199.0 L 582 199.0" stroke="#f85149" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="60" y="250" fill="#8b949e" font-size="10.5">Նոր տողը մտնում է MRU դիրքում։ A, B, C-ն մեկ քայլ հետ են գնում։</text>
<text x="60" y="268" fill="#e3b341" font-size="12.5" font-weight="bold" font-family="Consolas, Menlo, monospace">__ldcs  —  streaming load</text>
