<svg viewBox="0 0 1010 532" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/></marker></defs>
<rect width="1010" height="532" fill="#0d1117"/>
<text x="505.0" y="28" text-anchor="middle" fill="#e3b341" font-size="16" font-weight="bold">LRU-ն և cache operator-ները. ո՞ր տողն է դուրս մղվում և ո՞ւր է մտնում նորը</text>
<text x="60" y="56" fill="#e6edf3" font-size="12" font-weight="bold">Ելակետային վիճակ՝ cache-ը լի է</text>
<text x="116.0" y="72" text-anchor="middle" fill="#58a6ff" font-size="9.5">MRU՝ նոր օգտագործված</text>
<text x="494.0" y="72" text-anchor="middle" fill="#8b949e" font-size="9.5">LRU՝ հաջորդ զոհը</text>
<rect x="60" y="78" width="112" height="38" rx="5" fill="#1f6feb" fill-opacity="0.25" stroke="#58a6ff" stroke-width="1.6"/><text x="116.0" y="102.0" text-anchor="middle" fill="#e6edf3" font-size="14" font-family="Consolas, Menlo, monospace">A</text>
