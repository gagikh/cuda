<rect x="186" y="290" width="112" height="38" rx="5" fill="#1f6feb" fill-opacity="0.25" stroke="#58a6ff" stroke-width="1.6"/><text x="242.0" y="314.0" text-anchor="middle" fill="#e6edf3" font-size="14" font-family="Consolas, Menlo, monospace">B</text>
