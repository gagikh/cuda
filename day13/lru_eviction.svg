<rect x="438" y="290" width="112" height="38" rx="5" fill="#d29922" fill-opacity="0.25" stroke="#e3b341" stroke-width="1.6"/><text x="494.0" y="314.0" text-anchor="middle" fill="#e6edf3" font-size="14" font-family="Consolas, Menlo, monospace">X</text><text x="494.0" y="342" text-anchor="middle" fill="#8b949e" font-size="9.5">հաջորդ զոհը</text>
<rect x="590" y="290" width="112" height="38" rx="5" fill="#f85149" fill-opacity="0.16" stroke="#f85149" stroke-width="1.4" stroke-dasharray="5 4"/><text x="646.0" y="314.0" text-anchor="middle" fill="#f85149" font-size="14" font-family="Consolas, Menlo, monospace">D</text><text x="646.0" y="342" text-anchor="middle" fill="#f85149" font-size="9.5">դուրս է մղվում</text><path d="M 558 309.0 L 582 309.0" stroke="#f85149" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="60" y="360" fill="#8b949e" font-size="10.5">Նոր տողը մտնում է LRU դիրքում. հաջորդ բաց թողնումի զոհը հենց ինքն է, իսկ A, B, C-ն մնում են։</text>
<text x="60" y="378" fill="#e3b341" font-size="12.5" font-weight="bold" font-family="Consolas, Menlo, monospace">__ldlu  —  վերջին օգտագործման load</text>
<rect x="60" y="400" width="112" height="38" rx="5" fill="#1f6feb" fill-opacity="0.25" stroke="#58a6ff" stroke-width="1.6"/><text x="116.0" y="424.0" text-anchor="middle" fill="#e6edf3" font-size="14" font-family="Consolas, Menlo, monospace">A</text>
<rect x="186" y="400" width="112" height="38" rx="5" fill="#1f6feb" fill-opacity="0.25" stroke="#58a6ff" stroke-width="1.6"/><text x="242.0" y="424.0" text-anchor="middle" fill="#e6edf3" font-size="14" font-family="Consolas, Menlo, monospace">B</text>
<rect x="312" y="400" width="112" height="38" rx="5" fill="#1f6feb" fill-opacity="0.25" stroke="#58a6ff" stroke-width="1.6"/><text x="368.0" y="424.0" text-anchor="middle" fill="#e6edf3" font-size="14" font-family="Consolas, Menlo, monospace">C</text>
<rect x="438" y="400" width="112" height="38" rx="5" fill="#30363d" fill-opacity="0.25" stroke="#8b949e" stroke-width="1.6" stroke-dasharray="5 4"/><text x="494.0" y="424.0" text-anchor="middle" fill="#e6edf3" font-size="14" font-family="Consolas, Menlo, monospace">—</text><text x="494.0" y="452" text-anchor="middle" fill="#8b949e" font-size="9.5">ազատ</text>
<rect x="590" y="400" width="112" height="38" rx="5" fill="#f85149" fill-opacity="0.16" stroke="#f85149" stroke-width="1.4" stroke-dasharray="5 4"/><text x="646.0" y="424.0" text-anchor="middle" fill="#f85149" font-size="14" font-family="Consolas, Menlo, monospace">D</text><text x="646.0" y="452" text-anchor="middle" fill="#f85149" font-size="9.5">դուրս է մղվում</text><path d="M 558 419.0 L 582 419.0" stroke="#f85149" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="60" y="470" fill="#8b949e" font-size="10.5">X-ը բերվում է, կարդացվում, ապա տողն անմիջապես անվավեր է դառնում՝ տեղն ազատ է մնում։</text>
<text x="60" y="490" fill="#e6edf3" font-size="11">Տեղ բացելու համար բոլոր դեպքերում դուրս է մղվում LRU տողը՝ D։ Տարբերությունը միայն այն է, թե նոր տողը որտեղ է մտնում։</text>
<text x="60" y="508" fill="#8b949e" font-size="10">Hit-ի դեպքում տողը տեղափոխվում է MRU դիրք։ __stcs-ը նույնն է անում store-ի համար։</text>
<text x="60" y="524" fill="#8b949e" font-size="10">cudaAccessPolicyWindow-ը նույն կանոնը շեղում է ամբողջ բուֆերի համար՝ ոչ թե մեկ հրամանի։</text>
</svg>