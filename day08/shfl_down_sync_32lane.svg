  <text x="450" y="242" text-anchor="middle" fill="#6e7681" font-size="9.5">Կտրտած գծեր՝ հաշված աղբյուրը 0&#8211;31 միջակայքից դուրս է, այս lane-երը ստանում են իրենց սեփական արժեքը։</text>
  <text x="450" y="262" text-anchor="middle" fill="#e6edf3" font-size="11">_up-ի հայելային տարբերակը։ lane 28&#8211;31-ի համար իրենցից բարձր աղբյուր չկա։</text>
  <text x="450" y="278" text-anchor="middle" fill="#8b949e" font-size="10">offset-ը կիսելով՝ 16&#8594;8&#8594;4&#8594;2&#8594;1, ստանում ենք reduction-ը. դրա համար lane 0-ն ի վերջո պահում է գումարը։</text>
