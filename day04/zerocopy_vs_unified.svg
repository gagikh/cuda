<svg viewBox="0 0 900 444" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="444" fill="#0d1117"/>
  <text x="450" y="23" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="bold">Two Ways to Skip cudaMemcpy &#8212; and Why They Cost Differently</text>
  <text x="450" y="40" text-anchor="middle" fill="#8b949e" font-size="10.5">both let a kernel use a host pointer; only one of them ever moves a page</text>

  <!-- ============ LEFT: mapped / zero-copy ============ -->
  <rect x="24" y="56" width="416" height="332" rx="8" fill="none" stroke="#d29922" stroke-width="1.2" opacity="0.6"/>
  <text x="232" y="76" text-anchor="middle" fill="#d29922" font-size="13" font-weight="bold">Mapped &#183; zero-copy</text>
  <text x="232" y="91" text-anchor="middle" fill="#8b949e" font-size="9">cudaHostAlloc(..., cudaHostAllocMapped)</text>

  <rect x="60" y="112" width="340" height="44" rx="5" fill="#2b2410" stroke="#d29922" stroke-width="1.2"/>
  <text x="230" y="131" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="bold">HOST RAM &#183; pinned and mapped</text>
  <text x="230" y="146" text-anchor="middle" fill="#d29922" font-size="9">the data lives here and never leaves</text>

  <g>
    <path d="M 92 276 L 92 156" stroke="#1f6feb" stroke-width="1.6" opacity="0.3">
      <animate attributeName="opacity" values="0.3;1;0.3" keyTimes="0;0.5;1" dur="1.4s" begin="0.00s" repeatCount="indefinite"/>
    </path>
    <path d="M 140 156 L 140 276" stroke="#d29922" stroke-width="1.6" opacity="0.3">
      <animate attributeName="opacity" values="0.3;1;0.3" keyTimes="0;0.5;1" dur="1.4s" begin="0.18s" repeatCount="indefinite"/>
    </path>
    <path d="M 188 276 L 188 156" stroke="#1f6feb" stroke-width="1.6" opacity="0.3">
      <animate attributeName="opacity" values="0.3;1;0.3" keyTimes="0;0.5;1" dur="1.4s" begin="0.36s" repeatCount="indefinite"/>
    </path>
    <path d="M 236 156 L 236 276" stroke="#d29922" stroke-width="1.6" opacity="0.3">
      <animate attributeName="opacity" values="0.3;1;0.3" keyTimes="0;0.5;1" dur="1.4s" begin="0.54s" repeatCount="indefinite"/>
    </path>
    <path d="M 284 276 L 284 156" stroke="#1f6feb" stroke-width="1.6" opacity="0.3">
      <animate attributeName="opacity" values="0.3;1;0.3" keyTimes="0;0.5;1" dur="1.4s" begin="0.72s" repeatCount="indefinite"/>
    </path>
    <path d="M 332 156 L 332 276" stroke="#d29922" stroke-width="1.6" opacity="0.3">
      <animate attributeName="opacity" values="0.3;1;0.3" keyTimes="0;0.5;1" dur="1.4s" begin="0.90s" repeatCount="indefinite"/>
    </path>
    <path d="M 380 276 L 380 156" stroke="#1f6feb" stroke-width="1.6" opacity="0.3">
      <animate attributeName="opacity" values="0.3;1;0.3" keyTimes="0;0.5;1" dur="1.4s" begin="1.08s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="230" y="210" text-anchor="middle" fill="#8b949e" font-size="9">PCIe</text>
  <text x="230" y="224" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="bold">every access, every time</text>

  <rect x="60" y="276" width="340" height="44" rx="5" fill="#21262d" stroke="#30363d"/>
  <text x="230" y="295" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="bold">GPU &#183; kernel threads</text>
  <text x="230" y="310" text-anchor="middle" fill="#8b949e" font-size="9">nothing is cached in device memory</text>

  <text x="232" y="348" text-anchor="middle" fill="#e6edf3" font-size="10">Read one element three times &#8594; three bus round trips.</text>
  <text x="232" y="363" text-anchor="middle" fill="#8b949e" font-size="9.5">Rule: touch each byte once, and keep the accesses coalesced.</text>
  <text x="232" y="378" text-anchor="middle" fill="#8b949e" font-size="9.5">Reuse anything and you should have copied it to VRAM instead.</text>

  <!-- ============ RIGHT: unified memory ============ -->
  <rect x="460" y="56" width="416" height="332" rx="8" fill="none" stroke="#a371f7" stroke-width="1.2" opacity="0.6"/>
  <text x="668" y="76" text-anchor="middle" fill="#a371f7" font-size="13" font-weight="bold">Unified &#183; managed</text>
  <text x="668" y="91" text-anchor="middle" fill="#8b949e" font-size="9">cudaMallocManaged(...)</text>

  <rect x="496" y="112" width="340" height="44" rx="5" fill="#21262d" stroke="#30363d"/>
  <text x="666" y="131" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="bold">HOST RAM</text>
  <text x="666" y="146" text-anchor="middle" fill="#8b949e" font-size="9">pages live wherever they were last touched</text>

  <g>
    <rect x="634" y="164" width="52" height="26" rx="3" fill="#a371f7" opacity="0.9">
      <animate attributeName="y" values="164;198;198;164;164" keyTimes="0;0.3;0.6;0.9;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="660" y="181" text-anchor="middle" fill="#0d1117" font-size="9" font-weight="bold">4 KB
      <animate attributeName="y" values="181;215;215;181;181" keyTimes="0;0.3;0.6;0.9;1" dur="5s" repeatCount="indefinite"/>
    </text>
  </g>
  <text x="548" y="202" text-anchor="middle" fill="#8b949e" font-size="9">page fault</text>
  <text x="548" y="216" text-anchor="middle" fill="#a371f7" font-size="10" font-weight="bold">whole page migrates</text>
  <text x="548" y="230" text-anchor="middle" fill="#8b949e" font-size="9">dirty page migrates back</text>

  <rect x="496" y="276" width="340" height="44" rx="5" fill="#241a35" stroke="#a371f7" stroke-width="1.2"/>
  <text x="666" y="295" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="bold">DEVICE VRAM</text>
  <text x="666" y="310" text-anchor="middle" fill="#a371f7" font-size="9">once resident, accesses run at full VRAM bandwidth</text>

  <text x="668" y="348" text-anchor="middle" fill="#e6edf3" font-size="10">Read one element three times &#8594; one migration, then three local reads.</text>
  <text x="668" y="363" text-anchor="middle" fill="#f85149" font-size="9.5">But if host and device both keep touching a page, it ping-pongs.</text>
  <text x="668" y="378" text-anchor="middle" fill="#8b949e" font-size="9.5">Fix with cudaMemPrefetchAsync and cudaMemAdvise, not by hoping.</text>

  <text x="450" y="418" text-anchor="middle" fill="#e6edf3" font-size="11.5" font-weight="bold">Zero-copy moves no pages and charges you per access. Unified moves whole pages and charges you per migration.</text>
  <text x="450" y="434" text-anchor="middle" fill="#8b949e" font-size="9.5">Dirty-page tracking and migration belong to unified memory only. Mapped memory has no page to mark dirty &#8212; the data never left the host.</text>
</svg>
