<svg viewBox="0 0 900 418" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="418" fill="#0d1117"/>
  <text x="450" y="22" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="bold">Virtual Pages, Physical Frames, and What Locking Actually Locks</text>
  <text x="450" y="37" text-anchor="middle" fill="#8b949e" font-size="10.5">one malloc'd buffer followed through four states &#183; loops continuously</text>
  <g>
    <g opacity="0.3"><animate attributeName="opacity" values="1;0.3;0.3;0.3;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="20s" repeatCount="indefinite"/>
      <rect x="18" y="44" width="212" height="34" rx="5" fill="#0f1b2d" stroke="#1f6feb" stroke-width="1"/>
      <text x="124" y="59" text-anchor="middle" fill="#1f6feb" font-size="11" font-weight="bold">1 &#183; virtual &#8594; physical</text>
      <text x="124" y="72" text-anchor="middle" fill="#e6edf3" font-size="8.5">your contiguous buffer is scattered across frames</text>
    </g>
    <g opacity="0.3"><animate attributeName="opacity" values="0.3;1;0.3;0.3;0.3" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="20s" repeatCount="indefinite"/>
      <rect x="239" y="44" width="212" height="34" rx="5" fill="#2e1d0e" stroke="#f0883e" stroke-width="1"/>
      <text x="345" y="59" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">2 &#183; the OS relocates a page</text>
      <text x="345" y="72" text-anchor="middle" fill="#e6edf3" font-size="8.5">p3 moves f9 &#8594; f6; your pointer never changes</text>
    </g>
    <g opacity="0.3"><animate attributeName="opacity" values="0.3;0.3;1;0.3;0.3" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="20s" repeatCount="indefinite"/>
      <rect x="460" y="44" width="212" height="34" rx="5" fill="#2d1214" stroke="#f85149" stroke-width="1"/>
      <text x="566" y="59" text-anchor="middle" fill="#f85149" font-size="11" font-weight="bold">3 &#183; or evicts it to disk</text>
      <text x="566" y="72" text-anchor="middle" fill="#e6edf3" font-size="8.5">p1 is swapped out; its frame is gone</text>
    </g>
    <g opacity="0.3"><animate attributeName="opacity" values="0.3;0.3;0.3;1;0.3" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="20s" repeatCount="indefinite"/>
      <rect x="681" y="44" width="212" height="34" rx="5" fill="#11291a" stroke="#2ea043" stroke-width="1"/>
      <text x="787" y="59" text-anchor="middle" fill="#2ea043" font-size="11" font-weight="bold">4 &#183; cudaHostRegister</text>
      <text x="787" y="72" text-anchor="middle" fill="#e6edf3" font-size="8.5">frames locked: no move, no evict, DMA goes direct</text>
    </g>
  </g>

  <text x="450" y="96" text-anchor="middle" fill="#1f6feb" font-size="11" font-weight="bold">Virtual address space &#8212; what your pointer sees: one contiguous buffer</text>
