  <rect x="806" y="262" width="64" height="30" rx="3" fill="#2d1214" stroke="#f85149" stroke-width="1"/>
  <text x="838" y="281" text-anchor="middle" fill="#f85149" font-size="9">disk</text>
  <text x="380" y="326" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="bold">Physical RAM &#8212; what the copy engine sees: scattered frames</text>

  <rect x="716" y="212" width="168" height="40" rx="5" fill="#21262d" stroke="#30363d"/>
  <text x="800" y="228" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="bold">GPU copy engine</text>
  <text x="800" y="241" text-anchor="middle" fill="#8b949e" font-size="9">speaks physical addresses only</text>
  <g opacity="0.25"><animate attributeName="opacity" values="0.25;0.25;0.25;1;0.25" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="20s" repeatCount="indefinite"/>
    <path d="M 800 252 L 800 306 L 96 306" fill="none" stroke="#2ea043" stroke-width="2"/>
    <path d="M 96 306 l 8 -4 l 0 8 z" fill="#2ea043"/>
    <text x="448" y="302" text-anchor="middle" fill="#2ea043" font-size="9">DMA reads the locked frames directly &#8212; no CPU, no staging buffer</text>
  </g>

  <text x="450" y="360" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="bold">Your pointer is a virtual address. The copy engine needs a physical one, and only locking makes that stable.</text>
  <text x="450" y="377" text-anchor="middle" fill="#8b949e" font-size="10">States 2 and 3 are invisible to your program: the OS rewrites the page table, so the pointer keeps working. A physical address the driver recorded does not.</text>
  <text x="450" y="393" text-anchor="middle" fill="#8b949e" font-size="10">That is exactly why a pageable transfer stages through a buffer the driver has already locked, instead of reading yours.</text>
  <text x="450" y="409" text-anchor="middle" fill="#484f58" font-size="9">Locking is per-page and costs real memory: those frames leave the pool the OS can reclaim, for every process on the machine.</text>
</svg>
