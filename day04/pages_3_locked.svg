  <text x="450" y="22" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="bold">3 &#183; cudaHostRegister locks those frames in place</text>
  <text x="450" y="38" text-anchor="middle" fill="#8b949e" font-size="10">the OS may no longer relocate or evict them, so the physical address is finally stable</text>
  <rect x="632" y="60" width="240" height="40" rx="5" fill="#21262d" stroke="#30363d"/>
  <text x="752" y="76" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="bold">GPU copy engine</text>
  <text x="752" y="89" text-anchor="middle" fill="#8b949e" font-size="9">speaks physical addresses only</text>
