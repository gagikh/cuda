  <path d="M 812 100 L 812 170 L 106 170" fill="none" stroke="#2ea043" stroke-width="2"/>
  <path d="M 106 170 l 8 -4 l 0 8 z" fill="#2ea043"/>
  <text x="440" y="166" text-anchor="middle" fill="#2ea043" font-size="9">the copy engine reads these frames directly &#8212; no CPU, no staging buffer</text>
  <text x="450" y="198" text-anchor="middle" fill="#8b949e" font-size="10.5" font-weight="bold">Physical RAM &#8212; the six frames holding your buffer, now locked</text>
  <text x="450" y="220" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="bold">Locking removes the OS's freedom to move a page. It does not move, copy, or reorder anything.</text>
  <text x="450" y="236" text-anchor="middle" fill="#8b949e" font-size="9.5">The frames stay exactly as scattered as they were. The engine just walks the list, now that the list stays true.</text>
  <text x="450" y="253" text-anchor="middle" fill="#484f58" font-size="9">The cost: locked frames leave the pool the OS can reclaim, for every process on the machine.</text>
</svg>