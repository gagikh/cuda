  <text x="450" y="226" text-anchor="middle" fill="#8b949e" font-size="10.5" font-weight="bold">Physical RAM &#8212; what the GPU's copy engine sees</text>
  <text x="450" y="244" text-anchor="middle" fill="#e6edf3" font-size="11">Your malloc returned one contiguous range. The OS put the pages wherever there was room.</text>
  <text x="450" y="260" text-anchor="middle" fill="#8b949e" font-size="9.5">The page table is the only reason those scattered frames look contiguous to you.</text>
</svg>