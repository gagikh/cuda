    <line x1="145" y1="100" x2="222" y2="176" stroke="#1f6feb" stroke-width="1.8" opacity="0.85"/>
    <line x1="265" y1="100" x2="532" y2="176" stroke="#1f6feb" stroke-width="1.8" opacity="0.85"/>
    <line x1="385" y1="100" x2="160" y2="176" stroke="#1f6feb" stroke-width="1.8" opacity="0.85"/>
