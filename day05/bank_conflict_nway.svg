  <text x="450" y="336" text-anchor="middle" fill="#8b949e" font-size="11">shared-memory bank = (byte address / 4) mod 32 &#183; each bank serves one 4-byte word per cycle</text>

  <text x="450" y="364" text-anchor="middle" fill="#e6edf3" font-size="12">Cost of a warp's shared-memory access = the <tspan font-weight="bold">tallest bar</tspan>, not the number of bars.</text>
  <text x="450" y="384" text-anchor="middle" fill="#8b949e" font-size="11">Special case (not shown): if every thread reads the <tspan font-style="italic">same</tspan> address, the bank broadcasts &#8212; 1 transaction, not 32.</text>
</svg>
