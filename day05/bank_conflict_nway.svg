      <animate attributeName="height" values="18;36;0;0;18" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#2ea043;#d29922;#d29922;#d29922;#2ea043" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/>
    </rect>
