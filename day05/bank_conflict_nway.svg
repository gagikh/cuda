<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="400" fill="#0d1117"/>
  <text x="450" y="26" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="bold">N-Way Bank Conflicts: how access stride sets the transaction count</text>
  <text x="450" y="44" text-anchor="middle" fill="#8b949e" font-size="11">32 threads of one warp &#183; 32 shared-memory banks &#183; bar height = how many threads land on that bank &#183; loops continuously</text>

  <!-- phase captions (cross-fade) -->
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="450" y="74" fill="#2ea043">stride 1 &#8212; <tspan font-weight="normal">s[tid]</tspan> &#8594; every thread a different bank &#183; conflict-free &#183; 1 transaction
      <animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="74" fill="#d29922" opacity="0">stride 2 &#8212; <tspan font-weight="normal">s[2*tid]</tspan> &#8594; 2 threads per even bank &#183; 2-way conflict &#183; 2 transactions
      <animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="74" fill="#f0883e" opacity="0">stride 4 &#8212; <tspan font-weight="normal">s[4*tid]</tspan> &#8594; 4 threads per 4th bank &#183; 4-way conflict &#183; 4 transactions
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="74" fill="#f85149" opacity="0">stride 32 &#8212; <tspan font-weight="normal">tile[tid][col]</tspan> &#8594; all 32 threads on bank 0 &#183; 32-way conflict &#183; 32 transactions
      <animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- grid guides -->
  <g stroke="#21262d" stroke-width="1">
    <line x1="40" y1="300" x2="872" y2="300"/>
    <line x1="40" y1="282" x2="872" y2="282" stroke-dasharray="3 5"/>
    <line x1="40" y1="264" x2="872" y2="264" stroke-dasharray="3 5"/>
    <line x1="40" y1="228" x2="872" y2="228" stroke-dasharray="3 5"/>
    <line x1="40" y1="130" x2="872" y2="130" stroke-dasharray="3 5"/>
  </g>
  <g fill="#484f58" font-size="9" text-anchor="end">
    <text x="34" y="286">1</text>
    <text x="34" y="268">2</text>
    <text x="34" y="232">4</text>
    <text x="34" y="134">32</text>
  </g>

  <!-- bars: one per bank. Four keyframes = the four stride phases. -->
