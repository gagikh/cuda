    <rect x="40" y="282" width="22" height="18" rx="2" fill="#2ea043">
      <animate attributeName="y" values="282;264;228;130;282" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="height" values="18;36;72;170;18" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#2ea043;#d29922;#f0883e;#f85149;#2ea043" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/>
    </rect>
    <!-- bank 1 (odd): only stride-1 -->
